// ── what he feels (emotion.py: SentimentAnalyser + EmotionStateManager) ──
const LEXICON=Object.entries(S.LEXICON).map(([name,rules])=>[name,rules.map(([pattern,weight])=>[new RegExp(pattern,'gi'),weight])]);
const POSITIVE=new Set(S.POSITIVE),NEGATOR=new RegExp(S.NEGATOR,'i');
function analyse(text,origin){text=String(text||'').slice(0,4000);origin=origin||'orion';
 if(!text.trim())return {sentiment:'neutral',confidence:0,intensity:0,origin};
 const scores={};
 for(const [name,rules] of LEXICON){let total=0;
  for(const [pattern,weight] of rules){pattern.lastIndex=0;let hits=0,m;
   while((m=pattern.exec(text))!==null){if(m[0]==='')pattern.lastIndex++;
    if(!(POSITIVE.has(name)&&NEGATOR.test(text.slice(Math.max(0,m.index-32),m.index))))hits++;}
   if(hits)total+=weight*Math.min(hits,4);}
  if(total>0)scores[name]=total;}
 const ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
 if(!ranked.length)return {sentiment:'neutral',confidence:0.3,intensity:0.2,origin};
 const [best,bestScore]=ranked[0],runner=ranked.length>1?ranked[1][1]:0,margin=(bestScore-runner)/Math.max(bestScore,1e-9);
 const strength=Math.min(1,bestScore/6);
 return {sentiment:best,confidence:round2(Math.min(0.95,0.35+0.4*strength+0.25*margin)),
  intensity:round2(Math.min(1,bestScore/8)),origin};}
// Python's round(): an exact half goes to the even digit (0.625 -> 0.62).
function round2(x){const y=x*100,f=Math.floor(y);if(Math.abs(y-f-0.5)<1e-9)return (f%2===0?f:f+1)/100;return Math.round(y)/100;}
const mood={baseline:'neutral',override:'',until:0,intensity:1,current:'',currentIntensity:-1};
function emit(name,intensity){intensity=clamp(intensity);
 if(name===mood.current&&Math.abs(intensity-mood.currentIntensity)<0.1)return;
 mood.current=name;mood.currentIntensity=intensity;face.applyEmotion(name,{intensity});}
function resolveMood(){if(link)return;
 if(mood.override&&performance.now()<mood.until&&mood.baseline!=='sad'){emit(mood.override,mood.intensity);return;}
 mood.override='';emit(mood.baseline,1);}
function feel(text,origin){const payload=analyse(text,origin);
 if(payload.confidence<S.MIN_CONFIDENCE)return payload;
 const map=payload.origin==='user'?S.USER_SENTIMENT_EMOTION:S.SENTIMENT_EMOTION;let emotion=map[payload.sentiment]||'';
 if(!emotion||emotion==='neutral')return payload;
 if(payload.sentiment==='celebratory'&&payload.confidence>=S.EXCITED_AT)emotion='excited';
 if(payload.sentiment==='urgent'&&payload.confidence>=S.EXCITED_AT)emotion='critical';
 mood.override=emotion;mood.intensity=Math.max(0.25,payload.intensity||payload.confidence);
 mood.until=performance.now()+S.SENTIMENT_HOLD_S*1000;resolveMood();return payload;}

// ── the page: canvas, frame pacing, and the bridge the app drives ────────
const canvas=document.getElementById('face'),ctx=canvas.getContext('2d');
const face=new ScreenFace();
let colours={primary:hex(F.PALETTE.primary),accent:hex(F.PALETTE.accent),background:hex(F.PALETTE.background)};
let state='STANDBY',speaking=false,amplitude=0,link=false,last=performance.now(),lastDraw=0,lastChannels='';
function fit(){const dpr=Math.min(window.devicePixelRatio||1,3);let w=Math.max(8,Math.round(canvas.clientWidth*dpr)),h=Math.max(8,Math.round(canvas.clientHeight*dpr));
 const area=w*h;if(area>F.MAX_RENDER_PIXELS){const k=Math.sqrt(F.MAX_RENDER_PIXELS/area);w=Math.round(w*k);h=Math.round(h*k);}
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}}
function geometry(w,h){const r=Math.max(4,Math.min(h*0.33,w*0.30));return [w/2,h*0.47,r];}
function draw(now){const dt=(now-last)/1000;last=now;face.step(dt,amplitude,speaking,state);
 if(mood.override&&now>=mood.until)resolveMood();
 fit();const w=canvas.width,h=canvas.height,[cx,cy,r]=geometry(w,h);
 const k=colours.primary.join()+'/'+colours.accent.join()+'/'+colours.background.join();
 face.paint(ctx,w,h,cx,cy,r,colours.primary,colours.accent,colours.background,k);
 window.__orionRender.frames++;window.__orionRender.lastAt=now;}
function frame(now){requestAnimationFrame(frame);if(document.hidden)return;
 // The desktop's AnimationBudget: 30 frames a second while anything moves
 // or is about to (a blink, speech, the dots), 12 when the face is still.
 const active=face.anticipating||face.channels!==lastChannels||speaking;
 if(now-lastDraw<1000/(active?30:12)-2)return;lastDraw=now;lastChannels=face.channels;
 try{draw(now);}catch(e){window.__orionFailed=String(e&&e.message||e);}}
